[project]
name = "damuse"
version = "0.1.0"
description = "Discord music bot that curates for the shared taste of everyone in a voice channel"
authors = [{ name = "Stephen Drummond" }]
readme = "README.md"
requires-python = ">=3.13,<4.0"
# Exact versions live in poetry.lock; these ranges allow `poetry update`.
dependencies = [
    # [voice] pulls in PyNaCl and davey (Discord's DAVE end-to-end voice
    # encryption), both required to join voice channels
    "discord.py[voice]>=2.7.1,<3",
    "python-dotenv>=1.1.1,<2",
    "asyncpg>=0.30.0,<0.31",  # 0.x: minor releases may break
    "boto3>=1.43.70,<2",
    "spotipy>=2.25.1,<3",
    # calendar-versioned, and YouTube breaks old releases: keep this current
    "yt-dlp>=2025.9.26",
]

[tool.poetry]
# An application, not a library: install dependencies only, don't package it.
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
pytest-asyncio = "^1.2.0"
pytest-sugar = "^1.1.1"
pytest-cov = ">=6.0"
flake8 = "^7.3.0"
mypy = "^1.18.2"
black = "^25.9.0"
