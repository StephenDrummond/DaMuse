[flake8]
max-line-length = 88
extend-ignore = E203, W503
exclude =
    .git,
    __pycache__,
    venv,
    build,
    dist,
    .venv/,
    ffmpeg/

[tool:pytest]
addopts = -v
testpaths = tests
pythonpath = .
markers =
    integration: needs a real Postgres (TEST_DATABASE_URL); skipped without one

[mypy]
ignore_missing_imports = True
check_untyped_defs = True
exclude =
    .git
    __pycache__
    venv
    build
    dist
    .venv
    ffmpeg
namespace_packages = True

