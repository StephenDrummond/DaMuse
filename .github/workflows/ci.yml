name: Python CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.13.0]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Muse/requirements.txt
          pip install mypy black flake8

      - name: Set environment variables
        run: |
          echo "SPOTIFY_CLIENT_ID=${{ secrets.SPOTIFY_CLIENT_ID }}" >> $GITHUB_ENV
          echo "SPOTIFY_CLIENT_SECRET=${{ secrets.SPOTIFY_CLIENT_SECRET }}" >> $GITHUB_ENV

      - name: Run tests
        run: |
          cd Muse
          python -m pytest tests/ -v

      - name: Run mypy type checks
        run: |
          cd Muse
          python -m mypy .

      - name: Run black (check formatting)
        run: |
          cd Muse
          black .

      - name: Run flake8 linting
        run: |
          cd Muse
          flake8 .
