name: Python CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.13.0]

    # Real Postgres for tests/integration (the matching Aurora major version).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: damuse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/damuse_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Installed before setup-python so its Poetry cache can find it
      - name: Install Poetry
        run: pipx install poetry

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: poetry

      - name: Install dependencies
        run: |
          poetry check --lock
          poetry install

      # Unit + integration tests; no API credentials needed (clients are
      # injected and faked).
      - name: Run tests with coverage
        run: poetry run pytest --cov=. tests/ -v

      - name: Run mypy type checks
        run: poetry run mypy .

      - name: Check formatting with black
        run: poetry run black --check .

      - name: Run flake8 linting
        run: poetry run flake8 .
